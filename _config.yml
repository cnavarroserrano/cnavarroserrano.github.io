highlighter:      rouge
title:            "Cristian Navarro"
tagline:          ''
description:      'Assistant Professor, Universitat Rovira i Virgili'
url:              https://cristian-navarro.com
baseurl:          ''

author:
  name:           'Cristian Navarro'
  email:          'cnavarroserrano@gmail.com'

paginate:         10
paginate_path:    "/blog/page:num/"

plugins:
  - jekyll-paginate
  - jekyll-archives
  - jekyll-commonmark-ghpages
  - jekyll-seo-tag
  - jekyll-sitemap

disqus:
  shortname: cnavarroserrano

# Optional Google Analytics 4 measurement ID. Leave blank to disable analytics.
google_analytics: ''

# Default values applied by Jekyll.
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      classes: "wide"
      comments: true
      social-share: true
  -
    scope:
      path: ""
    values:
      layout: "page"
      classes: "wide"
