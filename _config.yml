highlighter:      rouge
title:            "Cristian Navarro"
tagline:          ''
description:      'PhD in Economics from CEMFI, Madrid'
url:              https://cristian-navarro.com
baseurl:          ''

author:
  name:           'Cristian Navarro'
  email:          'cnavarroserrano@gmail.com'

paginate:         10
paginate_path:    "/blog/page:num/"

plugins: 
  - jekyll-paginate
  - jekyll-archives
  - jekyll-commonmark-ghpages
  - jekyll-seo-tag
  - jekyll-sitemap

disqus:
  shortname: cnavarroserrano

# Optional Google Analytics 4 measurement ID (for example, G-XXXXXXXXXX).
# Leave blank to disable analytics.
google_analytics: ''

# Default YAML values (more information on Jekyll's site)
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      classes: "wide"
      comments: true  # add comments to all blog posts
      social-share: true # add social media sharing buttons to all blog posts
  -
    scope:
      path: "" # any file that's not a post will be a "page" layout by default
    values:
      layout: "page"
      classes: "wide"
      
