<head>
  <meta http-equiv="content-type" content="text/html; charset=utf-8">

  <!-- Metadata and mobile viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">

  <!-- Blog tag infrastructure -->
  {% if site.tags != "" %}
    {% include collecttags.html %}
  {% endif %}

  <title>
    {% assign tl = site.tagline | to_s | strip %}
    {% if page.url == "/" %}
      {{ site.title }}{% if tl != "" %} | {{ tl }}{% endif %}
    {% else %}
      {{ page.title | default: site.title }}
    {% endif %}
  </title>

  <!-- Stylesheets -->
  <script>
    try {
      if (localStorage.getItem('site-theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark';
      }
    } catch (error) {
      // The page remains in light mode if browser storage is unavailable.
    }
  </script>
  <link rel="stylesheet" href="{{ '/' | relative_url }}public/css/poole.css">
  <link rel="stylesheet" href="{{ '/' | relative_url }}public/css/syntax.css">
  <link rel="stylesheet" href="{{ '/' | relative_url }}public/css/hyde.css">
  <link rel="stylesheet" href="{{ '/public/css/custom.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script defer src="{{ '/public/js/theme-toggle.js' | relative_url }}"></script>
  
  <!-- Browser icon -->
  <link rel="icon" type="image/png" href="{{ '/public/favicon-urv.png' | relative_url }}">

  <!-- Atom feed -->
  <link rel="alternate" type="application/atom+xml" title="Atom feed" href="{{ '/atom.xml' | relative_url }}">

  <!-- MathJax -->
  {% include mathjax.html %}

  <!-- Font Awesome -->
  <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- SEO -->
  {% seo %}

</head>
