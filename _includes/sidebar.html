<style>
  /* Remove the theme padding so the portrait spans the full sidebar width. */
  .sidebar {
    padding: 0 !important; /* Overrides the padding defined by the Hyde theme. */
    overflow: hidden; /* Clips the portrait to any sidebar border radius. */
  }

  .sidebar-inner {
    padding: 0 !important;
  }

  .sidebar .sidebar-photo {
    display: block;
    width: 100%;
    height: auto;
    max-height: none;
    object-fit: contain; /* Keeps the complete portrait visible in stacked layouts. */
    object-position: center top;
    transform: translateY(0%); /* Overrides the base theme's upward offset. */
  }

  /* Keep the portrait edge-to-edge in every stacked layout. */
  @media (max-width: 64.999em) {
    .sidebar .sidebar-photo {
      height: min(56vh, 520px);
      object-fit: cover;
      object-position: center 15%;
    }

    .sidebar .sidebar-about {
      padding-bottom: 18px !important;
    }
  }

  /* Give wide tablets enough portrait height to keep the face in frame. */
  @media (min-width: 521px) and (max-width: 64.999em) and (min-aspect-ratio: 1/1) {
    .sidebar .sidebar-photo {
      height: min(65vh, 520px);
    }
  }

  /* Show more of the portrait on portrait-oriented touch tablets without hiding the navigation. */
  @media (min-width: 521px) and (max-width: 64.999em) and (min-height: 700px) and (max-aspect-ratio: 1/1) and (hover: none) and (pointer: coarse) {
    .sidebar .sidebar-photo {
      height: min(75vh, 680px, calc(100dvh - 17rem));
    }
  }

  .sidebar-about {
    display: flow-root; /* Prevents the heading margin from collapsing upward. */
    padding: 14px 20px 0 !important;
    border-top: 1px solid transparent; /* Preserves the gap below the portrait. */
  }

  .sidebar-about h1 {
    margin-top: 0 !important;
  }

  .sidebar-logo {
    display: block;
    width: 80%;
    max-width: 220px;
    height: auto;
    margin: 0 auto 12px;
  }

  /* Compact icon row between contact details and section links. */
  .sidebar-actions {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.25rem;
    margin-bottom: 0.5rem;
  }

  .sidebar-actions a,
  .sidebar-actions button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    padding: 0;
    border: 0;
    background: transparent;
    color: #fff;
    font: inherit;
    font-size: 1.15rem;
    cursor: pointer;
  }

  .sidebar-actions a:focus-visible,
  .sidebar-actions button:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 2px;
  }

  .sidebar-actions img {
    display: block;
    width: 1.25rem;
    height: 1.25rem;
    margin: 0; /* Cancels the global bottom margin applied to images. */
  }

  .sidebar-actions i {
    line-height: 1;
  }

  /* Keep the navigation visible on unusually short phone viewports. */
  @media (max-width: 520px) and (max-height: 700px) {
    .sidebar .sidebar-photo {
      height: min(53vh, 520px);
    }
  }

  /* On a heavily zoomed desktop, keep the portrait complete and leave room for the bio. */
  @media (max-width: 64.999em) and (max-height: 600px) and (min-aspect-ratio: 3/2) and (hover: hover) and (pointer: fine) {
    .sidebar .sidebar-photo {
      width: auto;
      max-width: 100%;
      height: min(80vh, 520px, max(10rem, calc(100dvh - 16.25rem)));
      margin: 0 auto;
      object-fit: contain;
      object-position: center top;
    }
  }

  /* Keep the portrait and bio in separate rows on desktop. */
  @media (min-width: 65em) {
    :root {
      --sidebar-width: clamp(14rem, calc(100vh - 300px), 16rem);
    }

    .sidebar {
      width: var(--sidebar-width);
      overflow-x: hidden;
      overflow-y: auto;
    }

    .sidebar-inner {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      row-gap: clamp(5px, 1vh, 8px); /* Guarantees a small red buffer below the portrait. */
      height: 100%;
    }

    .sidebar .sidebar-photo {
      width: 100%;
      height: min(520px, clamp(55vh, calc(40vh + 140px), 65vh));
      max-height: 100%;
      margin: 0;
      object-fit: cover;
    }

    .sidebar-about {
      position: static;
      width: 100%;
      box-sizing: border-box;
      align-self: end;
      padding: clamp(8px, 2vh, 14px) 20px min(1.5rem, 2.667vh) !important;
      font-size: clamp(0.875rem, 2.3vh, 1rem);
    }

    .sidebar-about h1 {
      font-size: clamp(1.55rem, 5vh, 2.2rem) !important;
    }

    .sidebar-about .lead {
      margin-bottom: clamp(0.35rem, 2.286vh, 1rem);
      font-size: clamp(0.8rem, 2.1vh, 0.9rem) !important;
    }

    .sidebar-about > span {
      height: clamp(0.2em, 1.143vh, 0.5em) !important;
    }

    .sidebar-about > br:last-child {
      display: none;
    }

    .sidebar-actions {
      justify-content: flex-end;
    }

    .content {
      margin-left: calc(var(--sidebar-width) + 6rem);
    }
  }

</style>
