<style>
  /* =========================================================
     CONFIGURACIÓN

     Cambia únicamente este valor si quieres una sidebar
     ligeramente más ancha o estrecha.
     ========================================================= */

  :root {
    --sidebar-width: 300px;
  }


  /* =========================================================
     MÓVIL: ESTADO BASE

     Foto completa, texto debajo y contenido principal después.
     ========================================================= */

  .sidebar {
    position: relative !important;

    width: 100% !important;
    height: auto !important;

    margin: 0 !important;
    padding: 0 !important;

    overflow: visible !important;
  }

  .sidebar-inner {
    display: block;

    width: 100%;
    height: auto;

    margin: 0;
    padding: 0 !important;
  }


  /* FOTO EN MÓVIL */

  .sidebar-photo-container {
    width: 100%;
    height: auto;

    margin: 0;
    padding: 0;

    overflow: visible;
  }

  .sidebar .sidebar-photo {
    display: block;

    width: 100%;
    height: auto;
    max-height: none;

    margin: 0;
    padding: 0;

    object-fit: contain;
    object-position: center top;

    transform: none;
  }


  /* BLOQUE INFERIOR */

  .sidebar-about {
    position: static !important;

    width: 100%;
    box-sizing: border-box;

    margin: 0 !important;
    padding: 18px 20px 22px !important;

    transform: none !important;
  }


  /* LOGO */

  .sidebar-logo {
    display: block;

    width: 70%;
    max-width: 220px;
    height: auto;

    margin: 0 auto 12px;
  }


  /* NOMBRE */

  .sidebar-name-link {
    color: white;
    text-decoration: none;
  }

  .sidebar-name-link:hover {
    color: white;
    text-decoration: none;
  }

  .sidebar-about h1 {
    margin: 0 0 2px !important;

    color: white;
    font-size: 2.2rem;
    line-height: 1.05;
  }


  /* INFORMACIÓN */

  .sidebar-about .lead {
    margin: 8px 0 24px;

    font-size: 0.9rem;
    line-height: 1.35;
  }

  .sidebar-email {
    white-space: nowrap;
  }


  /* MENÚ */

  .sidebar-navigation {
    line-height: 1.4;
  }

  .sidebar-navigation a {
    display: inline-block;
  }


  /* CONTENIDO PRINCIPAL EN MÓVIL */

  .content,
  .content.container {
    margin-left: 0 !important;
  }


  /* =========================================================
     ESCRITORIO

     - Sidebar fija de 300 px.
     - Texto inferior de tamaño constante.
     - Foto ocupa el espacio restante.
     - Si falta altura, se recorta la foto.
     ========================================================= */

  @media (min-width: 48em) {

    .sidebar {
      position: fixed !important;

      top: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      right: auto !important;

      width: var(--sidebar-width) !important;
      max-width: var(--sidebar-width) !important;

      height: 100vh !important;

      margin: 0 !important;
      padding: 0 !important;

      overflow: hidden !important;
    }


    /* Dos bloques:
       1. Foto flexible
       2. Texto con su altura natural y fija
    */

    .sidebar-inner {
      display: flex;
      flex-direction: column;

      width: 100%;
      height: 100%;

      min-height: 0;

      margin: 0;
      padding: 0 !important;
    }


    /* La foto absorbe toda la reducción vertical */

    .sidebar-photo-container {
      flex: 1 1 0;

      width: 100%;
      min-height: 0;

      margin: 0;
      padding: 0;

      overflow: hidden;
    }

    .sidebar .sidebar-photo {
      display: block;

      width: 100%;
      height: 100%;
      max-height: none;

      margin: 0;
      padding: 0;

      object-fit: cover;
      object-position: center top;

      transform: none;
    }


    /* El texto nunca invade la fotografía */

    .sidebar-about {
      position: static !important;

      flex: 0 0 auto;

      width: 100%;
      box-sizing: border-box;

      margin: 0 !important;
      padding: 14px 20px 18px !important;

      overflow: hidden !important;
      transform: none !important;
    }


    /* Tamaños completamente fijos */

    .sidebar-logo {
      width: 80%;
      max-width: 220px;

      margin: 0 auto 12px;
    }

    .sidebar-about h1 {
      margin: 0 0 2px !important;

      font-size: 2.2rem;
      line-height: 1.05;
    }

    .sidebar-about .lead {
      margin: 8px 0 24px;

      font-size: 0.9rem;
      line-height: 1.35;
    }

    .sidebar-navigation {
      font-size: 1rem;
      line-height: 1.4;
    }


    /* El contenido comienza después de la sidebar */

    .content,
    .content.container {
      margin-left: var(--sidebar-width) !important;
    }
  }
</style>


<div class="sidebar">

  <div class="sidebar-inner">

    <!-- FOTO PRINCIPAL -->
    <div class="sidebar-photo-container">
      <img
        src="/photos/portrait_main_adjustedside.jpg"
        class="sidebar-photo"
        alt="Cristian Navarro"
      >
    </div>


    <!-- BLOQUE INFERIOR -->
    <div class="sidebar-about">

      <!-- LOGO -->
      <img
        src="/photos/Logo-Test.png"
        class="sidebar-logo"
        alt="Logo de Cristian Navarro"
      >


      <!-- NOMBRE -->
      <a
        href="https://cristian-navarro.com/"
        class="sidebar-name-link"
      >
        <h1>CRISTIAN NAVARRO</h1>
      </a>


      <!-- INFORMACIÓN -->
      <p class="lead">
        PhD in Economics,
        <a href="https://cemfi.es/" target="_blank">CEMFI</a>

        <br>

        <a
          href="mailto:cnavarroserrano@gmail.com"
          class="sidebar-email"
        >
          cnavarroserrano@gmail.com
        </a>
      </p>


      <!-- MENÚ -->
      <nav class="sidebar-navigation">
        <a href="#welcome">About</a>
        <br>

        <a href="#working-papers">Research</a>
        <br>

        <a href="#teaching">Teaching</a>
      </nav>

    </div>

  </div>

</div>
