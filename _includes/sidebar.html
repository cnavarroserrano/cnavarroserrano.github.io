<style>
  /* Remove the theme padding so the portrait spans the full sidebar width. */
  .sidebar {
    padding: 0 !important; /* Overrides the padding defined by the Hyde theme. */
    overflow: hidden; /* Clips the portrait to any sidebar border radius. */
  }

  .sidebar-inner {
    padding: 0 !important;
  }

  .sidebar .sidebar-photo {
    display: block;
    width: 100%;
    height: auto;
    max-height: none;
    object-fit: contain; /* Keeps the complete portrait visible in stacked layouts. */
    object-position: center top;
    transform: translateY(0%); /* Overrides the base theme's upward offset. */
  }

  /* Cap the portrait between phone and desktop layouts without cropping it. */
  @media (min-width: 521px) and (max-width: 64.999em) {
    .sidebar .sidebar-photo {
      width: auto;
      max-width: 100%;
      height: min(55vh, 520px);
      margin: 0 auto;
    }
  }

  .sidebar-about {
    display: flow-root; /* Prevents the heading margin from collapsing upward. */
    padding: 14px 20px 0 !important;
    border-top: 1px solid transparent; /* Preserves the gap below the portrait. */
  }

  .sidebar-about h1 {
    margin-top: 0 !important;
  }

  .sidebar-logo {
    display: block;
    width: 80%;
    max-width: 220px;
    height: auto;
    margin: 0 auto 12px;
  }

  /* Keep the portrait and bio in separate rows on desktop. */
  @media (min-width: 65em) {
    .sidebar {
      overflow-x: hidden;
      overflow-y: auto;
    }

    .sidebar-inner {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      height: 100%;
    }

    .sidebar .sidebar-photo {
      width: 100%;
      height: min(520px, clamp(55vh, calc(40vh + 140px), 65vh));
      max-height: 100%;
      margin: 0;
      object-fit: cover;
    }

    .sidebar-about {
      position: static;
      width: 100%;
      box-sizing: border-box;
      align-self: end;
      padding: clamp(8px, 2vh, 14px) 20px min(1.5rem, 2.667vh) !important;
      font-size: clamp(0.875rem, 2.3vh, 1rem);
    }

    .sidebar-about h1 {
      font-size: clamp(1.55rem, 5vh, 2.2rem) !important;
    }

    .sidebar-about .lead {
      margin-bottom: clamp(0.35rem, 2.286vh, 1rem);
      font-size: clamp(0.8rem, 2.1vh, 0.9rem) !important;
    }

    .sidebar-about > span {
      height: clamp(0.2em, 1.143vh, 0.5em) !important;
    }

    .sidebar-about > br:last-child {
      display: none;
    }
  }

</style>

<div class="sidebar">
  <div class="sidebar-inner">
    <img src="/photos/portrait_main_adjustedside.jpg" class="sidebar-photo" alt="Portrait of Cristian Navarro">
    <div class="sidebar-about">
      <!-- Alternative logo retained for possible future use:
      <img
        src="{{ '/photos/Logo-Test.png' | relative_url }}"
        class="sidebar-logo"
        alt="Alternative logo"
      >
      -->
      <a href="https://cnavarroserrano.github.io/" style="color: white;">
        <h1 style="color: white; font-size: 2.2rem; margin-bottom: 1px;">CRISTIAN NAVARRO</h1>
      </a>
      <p class="lead" style="font-size: 0.9rem">
        PhD in Economics, <a href="https://cemfi.es/" target="_blank">CEMFI</a>
        <br>
        <a href="mailto:cnavarroserrano@gmail.com">cnavarroserrano@gmail.com</a>
      </p>

      <!-- Section navigation -->
      <span style="display: block; height: 0.5em;"></span>
      <a href="#welcome">About</a>
      <br>
      <a href="#working-papers">Research</a>
      <br>
      <a href="#teaching">Teaching</a>
      <br>
      <br>
    </div>
  </div>
</div>
