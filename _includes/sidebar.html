<style>
  /* =========================================================
     AJUSTES PRINCIPALES

     Para cambiar el ancho máximo de la sidebar:
       modifica 300px.

     Para cambiar la proporción de altura de la foto:
       modifica 55vh / 55dvh.
     ========================================================= */

  :root {
    --sidebar-desktop-width: clamp(220px, 19vw, 300px);
  }


  /* =========================================================
     MÓVIL: COMPORTAMIENTO POR DEFECTO

     La sidebar ocupa todo el ancho.
     La fotografía se muestra completa.
     El contenido principal aparece debajo.
     ========================================================= */

  .sidebar {
    position: relative !important;

    top: auto !important;
    right: auto !important;
    bottom: auto !important;
    left: auto !important;

    width: 100% !important;
    max-width: none !important;

    height: auto !important;
    min-height: 0 !important;

    padding: 0 !important;
    margin: 0 !important;

    overflow: visible !important;
  }

  .sidebar-inner {
    display: block;

    width: 100%;
    height: auto;
    min-height: 0;

    padding: 0 !important;
    margin: 0 !important;
  }


  /* =========================================================
     FOTO EN MÓVIL

     height:auto impide que aparezca solamente la frente.
     ========================================================= */

  .sidebar-photo-container {
    display: block;

    width: 100%;
    height: auto !important;
    min-height: 0;

    margin: 0;
    padding: 0;

    overflow: visible;
  }

  .sidebar .sidebar-photo {
    display: block;

    width: 100%;
    height: auto !important;
    max-height: none !important;

    margin: 0;
    padding: 0;

    object-fit: contain !important;
    object-position: center top !important;

    transform: none !important;
  }


  /* =========================================================
     BLOQUE INFERIOR
     ========================================================= */

  .sidebar-about {
    position: static !important;

    top: auto !important;
    right: auto !important;
    bottom: auto !important;
    left: auto !important;

    display: block;

    width: 100%;
    box-sizing: border-box;

    margin: 0 !important;
    padding: 18px 20px 22px !important;

    overflow: visible;
    transform: none !important;
  }


  /* =========================================================
     LOGO
     ========================================================= */

  .sidebar-logo {
    display: block;

    width: 70%;
    min-width: 110px;
    max-width: 220px;
    height: auto;

    margin: 0 auto 12px;
  }


  /* =========================================================
     NOMBRE
     ========================================================= */

  .sidebar-name-link {
    color: white;
    text-decoration: none;
  }

  .sidebar-name-link:hover {
    color: white;
    text-decoration: none;
  }

  .sidebar-about h1 {
    margin: 0 0 2px !important;

    color: white;
    font-size: 2rem;
    line-height: 1.05;
  }


  /* =========================================================
     INFORMACIÓN Y EMAIL
     ========================================================= */

  .sidebar-about .lead {
    margin: 8px 0 24px;

    font-size: 0.9rem;
    line-height: 1.35;
  }

  .sidebar-email {
    white-space: nowrap;
  }


  /* =========================================================
     MENÚ
     ========================================================= */

  .sidebar-navigation {
    line-height: 1.4;
  }

  .sidebar-navigation a {
    display: inline-block;
  }


  /* =========================================================
     CONTENIDO PRINCIPAL EN MÓVIL

     Esto elimina el margen de escritorio que estaba dejando
     la columna blanca a la derecha de la sidebar estrecha.
     ========================================================= */

  .content,
  .content.container {
    margin-left: 0 !important;
    margin-right: auto !important;
  }


  /* =========================================================
     ESCRITORIO

     Sidebar y contenido cambian de modo exactamente en el mismo
     breakpoint. No puede existir un estado intermedio.

     La fotografía tiene una altura independiente del texto.
     Por eso no gana altura cuando el texto cambia de tamaño
     o salta de línea.
     ========================================================= */

  @media (min-width: 800px) {

    .sidebar {
      position: fixed !important;

      top: 0 !important;
      right: auto !important;
      bottom: 0 !important;
      left: 0 !important;

      width: var(--sidebar-desktop-width) !important;
      max-width: 300px !important;

      height: 100vh !important;
      height: 100dvh !important;

      overflow: hidden !important;
    }

    .sidebar-inner {
      display: flex;
      flex-direction: column;

      width: 100%;
      height: 100%;
      min-height: 0;
    }


    /* =======================================================
       FOTO EN ESCRITORIO

       Su altura depende únicamente de la altura del viewport.

       Al aumentar el zoom:
       - disminuye el viewport en píxeles CSS;
       - disminuye 55vh;
       - la fotografía pierde altura de forma continua.

       El texto ya no puede hacer que la fotografía crezca.
       ======================================================= */

    .sidebar-photo-container {
      flex: 0 0 auto;

      width: 100%;

      height: clamp(160px, 55vh, 520px) !important;
      height: clamp(160px, 55dvh, 520px) !important;

      overflow: hidden;
    }

    .sidebar .sidebar-photo {
      width: 100%;
      height: 100% !important;
      max-height: none !important;

      object-fit: cover !important;
      object-position: center top !important;
    }


    /* =======================================================
       TEXTO EN ESCRITORIO

       Ocupa el espacio inferior. Si excepcionalmente no cabe,
       se desplaza internamente, pero nunca pisa la fotografía.
       ======================================================= */

    .sidebar-about {
      flex: 1 1 auto;
      min-height: 0;

      padding:
        clamp(8px, 1.4vh, 14px)
        clamp(14px, 1.3vw, 20px)
        clamp(10px, 1.8vh, 18px)
        !important;

      overflow-x: hidden;
      overflow-y: auto;
    }


    /* Logo: reducción continua, sin breakpoints verticales */

    .sidebar-logo {
      width: 72%;
      min-width: 105px;
      max-width: 200px;

      margin-bottom: clamp(6px, 1.2vh, 12px);
    }


    /* Nombre: reducción continua */

    .sidebar-about h1 {
      font-size: clamp(
        1.5rem,
        calc(1rem + 1.8vh),
        2.2rem
      );

      line-height: 1.05;
    }


    /* Información: reducción continua */

    .sidebar-about .lead {
      margin:
        clamp(4px, 0.8vh, 8px)
        0
        clamp(10px, 2vh, 24px);

      font-size: clamp(
        0.72rem,
        calc(0.58rem + 0.5vh),
        0.9rem
      );

      line-height: 1.3;
    }


    /* Menú: reducción continua */

    .sidebar-navigation {
      font-size: clamp(
        0.82rem,
        calc(0.65rem + 0.55vh),
        1rem
      );

      line-height: 1.3;
    }


    /* El contenido empieza exactamente después de la sidebar */

    .content,
    .content.container {
      margin-left: var(--sidebar-desktop-width) !important;
      margin-right: auto !important;
    }
  }


  /* =========================================================
     MÓVIL EXPLÍCITO

     Se repiten los resets importantes con mayor prioridad para
     neutralizar cualquier media query del tema.
     ========================================================= */

  @media (max-width: 799px) {

    .sidebar {
      position: relative !important;

      top: auto !important;
      right: auto !important;
      bottom: auto !important;
      left: auto !important;

      width: 100% !important;
      max-width: none !important;

      height: auto !important;
      min-height: 0 !important;

      overflow: visible !important;
    }

    .sidebar-inner {
      display: block !important;

      width: 100% !important;
      height: auto !important;
    }

    .sidebar-photo-container {
      width: 100% !important;
      height: auto !important;

      overflow: visible !important;
    }

    .sidebar .sidebar-photo {
      display: block !important;

      width: 100% !important;
      height: auto !important;
      max-height: none !important;

      object-fit: contain !important;
      object-position: center top !important;
    }

    .sidebar-about {
      width: 100% !important;
      height: auto !important;

      overflow: visible !important;
    }

    .content,
    .content.container {
      width: auto !important;

      margin-left: 0 !important;
      margin-right: auto !important;

      padding-top: 2rem !important;
    }
  }
</style>


<div class="sidebar">

  <div class="sidebar-inner">

    <!-- FOTO PRINCIPAL -->
    <div class="sidebar-photo-container">
      <img
        src="/photos/portrait_main_adjustedside.jpg"
        class="sidebar-photo"
        alt="Cristian Navarro"
      >
    </div>


    <!-- CONTENIDO INFERIOR -->
    <div class="sidebar-about">

      <!-- LOGO -->
      <img
        src="/photos/Logo-Test.png"
        class="sidebar-logo"
        alt="Logo de Cristian Navarro"
      >


      <!-- NOMBRE -->
      <a
        href="https://cristian-navarro.com/"
        class="sidebar-name-link"
      >
        <h1>CRISTIAN NAVARRO</h1>
      </a>


      <!-- INFORMACIÓN -->
      <p class="lead">
        PhD in Economics,
        <a href="https://cemfi.es/" target="_blank">CEMFI</a>

        <br>

        <a
          href="mailto:cnavarroserrano@gmail.com"
          class="sidebar-email"
        >
          cnavarroserrano@gmail.com
        </a>
      </p>


      <!-- MENÚ -->
      <nav class="sidebar-navigation">
        <a href="#welcome">About</a>
        <br>

        <a href="#working-papers">Research</a>
        <br>

        <a href="#teaching">Teaching</a>
      </nav>

    </div>

  </div>

</div>
