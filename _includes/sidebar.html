<style>
  /* Remove the theme padding so the portrait spans the full sidebar width. */
  .sidebar {
    padding: 0 !important; /* Overrides the padding defined by the Hyde theme. */
    overflow: hidden; /* Clips the portrait to any sidebar border radius. */
  }

  .sidebar-inner {
    padding: 0 !important;
  }

  .sidebar .sidebar-photo {
    display: block;
    width: 100%;
    height: min(55vh, 520px);
    max-height: calc(100vh - 280px); /* Reserves room for the bio and navigation. */
    object-fit: cover;
    transform: translateY(0%); /* Overrides the base theme's upward offset. */
  }

  @media (max-width: 520px) {
    .sidebar .sidebar-photo {
      width: 100%;
      height: auto; /* Shows the complete portrait on narrow screens. */
      max-height: none; /* Removes the desktop height cap. */
      object-fit: contain; /* Prevents cropping. */
      object-position: center top;
      display: block;
    }
  }

  .sidebar-about {
    display: flow-root; /* Prevents the heading margin from collapsing upward. */
    padding: 14px 20px 0 !important;
    border-top: 1px solid transparent; /* Preserves the gap below the portrait. */
  }

  .sidebar-about h1 {
    margin-top: 0 !important;
  }

  .sidebar-logo {
    display: block;
    width: 80%;
    max-width: 220px;
    height: auto;
    margin: 0 auto 12px;
  }

  /* Treat short desktop viewports like mobile to avoid cropping the portrait. */
  @media (max-height: 600px) {
    .sidebar .sidebar-photo {
      width: 100%;
      height: auto;
      max-height: none;
      object-fit: contain;
      object-position: center top;
      display: block;
    }
  }
</style>

<div class="sidebar">

    <img src="/photos/portrait_main_adjustedside.jpg" class="sidebar-photo" alt="Portrait of Cristian Navarro">
    <div class="sidebar-about">

        src="{{ '/photos/Logo-Test.png' | relative_url }}"
        class="sidebar-logo"
        alt="Alternative logo"
      >
      -->
      <a href="https://cnavarroserrano.github.io/" style="color: white;">
        <h1 style="color: white; font-size: 2.2rem; margin-bottom: 1px;">CRISTIAN NAVARRO</h1>
      </a>
      <p class="lead" style="font-size: 0.9rem">
        PhD in Economics, <a href="https://cemfi.es/" target="_blank">CEMFI</a>
        <br>
        <a href="mailto:cnavarroserrano@gmail.com">cnavarroserrano@gmail.com</a>
      </p>

      <!-- Section navigation -->
      <span style="display: block; height: 0.5em;"></span>
