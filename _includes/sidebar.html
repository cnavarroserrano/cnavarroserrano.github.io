<style>
  /* =========================================================
     DISEÑO BASE: MÓVIL

     Se define primero el comportamiento móvil para impedir que
     las reglas de escritorio sigan activas durante la transición.
     ========================================================= */

  .sidebar {
    width: 100%;
    max-width: none;
    height: auto;
    min-height: 0;

    padding: 0 !important;
    overflow: visible;
  }

  .sidebar-inner {
    display: block;

    width: 100%;
    height: auto;
    min-height: 0;

    padding: 0 !important;
  }


  /* =========================================================
     FOTO EN MÓVIL

     Siempre se muestra completa, sin recortes.
     ========================================================= */

  .sidebar-photo-container {
    width: 100%;
    height: auto;
    min-height: 0;

    overflow: visible;
  }

  .sidebar .sidebar-photo {
    display: block;

    width: 100%;
    height: auto;
    max-height: none;

    object-fit: contain;
    object-position: center top;

    transform: none;
  }


  /* =========================================================
     BLOQUE DE TEXTO
     ========================================================= */

  .sidebar-about {
    position: static !important;

    top: auto !important;
    right: auto !important;
    bottom: auto !important;
    left: auto !important;

    display: block;

    width: 100%;
    box-sizing: border-box;

    margin: 0 !important;
    padding: 18px 20px 22px !important;

    transform: none !important;
  }


  /* =========================================================
     LOGO
     ========================================================= */

  .sidebar-logo {
    display: block;

    width: 70%;
    min-width: 120px;
    max-width: 220px;
    height: auto;

    margin: 0 auto 12px;
  }


  /* =========================================================
     NOMBRE
     ========================================================= */

  .sidebar-name-link {
    color: white;
    text-decoration: none;
  }

  .sidebar-name-link:hover {
    color: white;
    text-decoration: none;
  }

  .sidebar-about h1 {
    margin: 0 0 2px !important;

    color: white;
    font-size: 2rem;
    line-height: 1.05;
  }


  /* =========================================================
     SUBTÍTULO Y CONTACTO
     ========================================================= */

  .sidebar-about .lead {
    margin: 8px 0 24px;

    font-size: 0.9rem;
    line-height: 1.35;
  }

  .sidebar-email {
    white-space: nowrap;
  }


  /* =========================================================
     MENÚ
     ========================================================= */

  .sidebar-navigation {
    line-height: 1.4;
  }

  .sidebar-navigation a {
    display: inline-block;
  }


  /* =========================================================
     ESCRITORIO

     El breakpoint de 48em equivale normalmente a 768px y
     coincide con el salto a escritorio de muchos temas.

     - Máximo de sidebar: 320px.
     - El ancho disminuye progresivamente al aumentar el zoom.
     - La foto recibe el espacio sobrante.
     - El texto nunca puede colocarse encima de la foto.
     ========================================================= */

  @media (min-width: 48em) {
    .sidebar {
      /*
       * 220px: ancho mínimo antes de entrar en móvil.
       * 24vw: permite que se estreche progresivamente con el zoom.
       * 320px: ancho máximo.
       */
      width: clamp(220px, 24vw, 320px);
      max-width: 320px;

      height: 100vh;
      height: 100dvh;

      overflow: hidden;
    }

    .sidebar-inner {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;

      width: 100%;
      height: 100%;
      min-height: 0;
    }


    /* La fotografía recibe exactamente el espacio restante */

    .sidebar-photo-container {
      width: 100%;
      height: auto;
      min-height: 0;

      overflow: hidden;
    }

    .sidebar .sidebar-photo {
      width: 100%;
      height: 100%;
      max-height: none;

      object-fit: cover;
      object-position: center top;
    }


    /* El bloque inferior mantiene su espacio propio */

    .sidebar-about {
      width: 100%;

      /*
       * El padding disminuye suavemente cuando disminuye
       * la altura disponible. No hay saltos por media queries.
       */
      padding:
        clamp(8px, 1.4vh, 14px)
        clamp(14px, 1.5vw, 20px)
        clamp(10px, 1.8vh, 18px)
        !important;
    }


    /* Logo con reducción gradual */

    .sidebar-logo {
      width: 75%;
      min-width: 110px;
      max-width: 220px;

      margin-bottom: clamp(6px, 1.2vh, 12px);
    }


    /* Nombre con reducción gradual según la altura */

    .sidebar-about h1 {
      font-size: clamp(
        1.55rem,
        calc(1.05rem + 1.9vh),
        2.2rem
      );

      line-height: 1.05;
    }


    /* Información con reducción gradual */

    .sidebar-about .lead {
      margin:
        clamp(4px, 0.8vh, 8px)
        0
        clamp(10px, 2vh, 24px);

      font-size: clamp(0.72rem, 1.1vw, 0.9rem);
      line-height: 1.3;
    }


    /* Menú con reducción gradual */

    .sidebar-navigation {
      font-size: clamp(0.82rem, 1.2vw, 1rem);
      line-height: 1.3;
    }
  }
</style>


<div class="sidebar">

  <div class="sidebar-inner">

    <!-- FOTO PRINCIPAL -->
    <div class="sidebar-photo-container">
      <img
        src="/photos/portrait_main_adjustedside.jpg"
        class="sidebar-photo"
        alt="Cristian Navarro"
      >
    </div>


    <!-- CONTENIDO INFERIOR -->
    <div class="sidebar-about">

      <!-- LOGO -->
      <img
        src="/photos/Logo-Test.png"
        class="sidebar-logo"
        alt="Logo de Cristian Navarro"
      >


      <!-- NOMBRE -->
      <a
        href="https://cnavarroserrano.github.io/"
        class="sidebar-name-link"
      >
        <h1>CRISTIAN NAVARRO</h1>
      </a>


      <!-- INFORMACIÓN -->
      <p class="lead">
        PhD in Economics,
        <a href="https://cemfi.es/" target="_blank">CEMFI</a>

        <br>

        <a
          href="mailto:cnavarroserrano@gmail.com"
          class="sidebar-email"
        >
          cnavarroserrano@gmail.com
        </a>
      </p>


      <!-- MENÚ -->
      <nav class="sidebar-navigation">
        <a href="#welcome">About</a>
        <br>

        <a href="#working-papers">Research</a>
        <br>

        <a href="#teaching">Teaching</a>
      </nav>

    </div>

  </div>

</div>
