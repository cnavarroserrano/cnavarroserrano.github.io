<style>
  /* Make the sidebar edge-to-edge and clip to rounded corners (if any) */
  .sidebar{
    padding: 0 !important;       /* theme likely adds padding */
    overflow: hidden;            /* so the image fills + respects border-radius */
  }

  /* Keep the inner wrapper clean */
  .sidebar-inner{
    padding: 0 !important;
  }

 /* ensure the rule wins */
  .sidebar .sidebar-photo{
    display:block;
    width:100%;
    height: min(55vh, 520px);
    max-height: calc(100vh - 280px);  /* ← add this */
    object-fit: cover;
    transform: translateY(0%);   /* positive = push image down */
  }
  @media (max-width: 520px){
    .sidebar .sidebar-photo{
      width: 100%;
      height: auto;          /* show full image height */
      max-height: none;      /* cancel the desktop cap */
      object-fit: contain;   /* no cropping */
      object-position: center top; /* harmless here; keeps head visible */
      display: block;
    }

    border-top: 1px solid transparent; /* ok to keep; harmless */
  }

  /* optional but helpful: prevent the heading from pulling upward */
  .sidebar-about h1{
    margin-top: 0 !important;
  }
</style>
